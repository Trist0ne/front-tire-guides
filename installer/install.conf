# Front Tire Guides: settings for the installer. Copied to SYNC with the programs.

# The Tire Guides button in Ford's camera view row (the menu button at the top left of the camera picture, beside
# the normal and 180-degree views), on front views only. 0 = no button: use the switch on the settings page.
VIEW_BUTTON=1

# The Tire Guides switch and the Lift Offset slider under Settings > Vehicle > Driver Assistance > Front Camera.
# 0 = no page: the guides are always on and the lift is whatever lift.json says (none: stock).
SETTINGS_PAGE=1

# Started with SYNC's own services, so the guides are there as soon as the camera is: one line of ours in SYNC's
# startup script, straight after the line that launches SYNC's services. 0 = started by the F-Mods launcher instead,
# which runs about a minute after SYNC starts.
EARLY_START=1

# UNINSTALL=1: plugging this stick in takes Front Tire Guides off SYNC and puts Ford's files back, then restarts.
UNINSTALL=0
